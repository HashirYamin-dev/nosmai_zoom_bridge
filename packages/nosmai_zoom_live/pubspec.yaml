name: nosmai_zoom_live
description: >-
  Livestream Nosmai beauty filters, AR effects, backgrounds and cloud filters
  through the Zoom Video SDK from Flutter, without writing Android code.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  nosmai_effects_sdk: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nosmai.zoom_live
        pluginClass: NosmaiZoomLivePlugin
      ios:
        pluginClass: NosmaiZoomLivePlugin
